version: "3.8"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USER: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite+aiosqlite:///./data/beacon.db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: beacon
      KEYCLOAK_CLIENT_ID: beacon-pilot
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      SESSION_COOKIE_NAME: beacon_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT: "30"
      TRUSTED_BASE_REF: origin/main
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
      - ./backend:/app:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:8000
      VITE_OIDC_ISSUER: http://127.0.0.1:8080/realms/beacon
      VITE_OIDC_CLIENT_ID: beacon-pilot
      VITE_OIDC_REDIRECT_URI: http://127.0.0.1:5173/callback
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak_data:
  backend_data:
  frontend_node_modules: