name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run backend tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: backend
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          KEYCLOAK_URL: ""
          SESSION_SECRET: "test-secret"
          OIDC_ISSUER: "http://localhost:8080/realms/test"
          OIDC_CLIENT_ID: "test"
          OIDC_REDIRECT_URI: "http://localhost:5173/callback"
          LLM_API_KEY: ""
          TRUSTED_BASE_REF: "origin/main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run build 2>&1 | head -50
      - name: Run frontend tests
        run: npm test -- --run

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: beacon-pilot/backend:test
          load: true
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: beacon-pilot/frontend:test
          load: true